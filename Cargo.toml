[package]
name = "brz-http-gateway"
version = "0.2.17"
edition = "2024"
rust-version = "1.85"
description = "Route-selective HTTP/1.1 gateway with streaming and upgrade fallback"
license = "MIT OR Apache-2.0"
repository = "https://github.com/we-breeze/http-gateway"

[dependencies]
arc-swap = { version = "1", optional = true }
brz-http-server = { version = "=0.0.33", features = ["hyper"], optional = true }
brz-http-cors = { version = "=0.0.6", optional = true }
bytes = { version = "1", optional = true }
brz-http-router = { version = "=0.1.4", optional = true }
brz-redis = { version = "=0.0.18", optional = true }
http = "1"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "server", "tokio"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha1 = { version = "0.10", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"], optional = true }
toml = { version = "0.9", optional = true }
tracing = { version = "0.1", optional = true }
rand = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[features]
default = ["http-gateway"]
http-gateway = [
    "dep:brz-http-cors", "dep:brz-http-server", "dep:bytes", "dep:http-body-util",
    "dep:hyper", "dep:hyper-util", "dep:tokio", "dep:tracing", "route-config",
]
route-config = ["dep:brz-http-router", "dep:serde", "dep:toml"]
fallback-log = ["http-gateway"]
redis-recording = [
    "dep:arc-swap", "dep:brz-http-router", "dep:brz-redis", "dep:bytes", "dep:rand",
    "dep:serde", "dep:serde_json", "dep:sha1", "dep:tokio", "dep:tracing",
]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
name = "brz_http_gateway"

[[example]]
name = "redis-recording"
required-features = ["http-gateway", "redis-recording"]

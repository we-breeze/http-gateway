[package]
name = "brz-http-gateway"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Route-selective HTTP/1.1 gateway with streaming and upgrade fallback"
license = "MIT OR Apache-2.0"
repository = "https://github.com/we-breeze/http-gateway"

[dependencies]
brz-http-cors = "=0.0.1"
bytes = "1"
brz-http-router = "=0.1.2"
brz-redis = { version = "0.0.10", optional = true }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "server", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
rand = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[features]
default = []
fallback-log = []
redis-recording = ["dep:brz-redis", "dep:rand", "dep:serde_json"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
name = "brz_http_gateway"
